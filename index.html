<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <title>Лабораторна 4 — кешування</title>
  <link rel="stylesheet" href="css.php">
</head>
<body>
  <h1>Лабораторна робота №4: кешування в PHP</h1>

  <h2>1. Клієнтське кешування</h2>
  <p>Стилі підключені через <code>css.php</code> (max-age + Expires). Зображення (ETag / 304):</p>
  <img src="image.php" alt="logo">
  <p><a class="btn" href="index.html">Перейти на сторінку знову (без Ctrl+F5)</a></p>

  <h2>2. Файловий кеш</h2>
  <button onclick="run('generate-report.php','out-report',true)">Завантажити звіт</button>
  <button onclick="clearCache()">Очистити кеш</button>
  <div id="out-report"></div>

  <h2>3. Сесійний кеш</h2>
  <button onclick="run('session-cache.php','out-session',false)">Отримати курси</button>
  <pre id="out-session"></pre>

  <h2>4. Статична властивість класу</h2>
  <button onclick="run('static-cache.php','out-static',false)">Запустити</button>
  <pre id="out-static"></pre>

  <h2>Журнал</h2>
  <pre id="log"></pre>

<script>
async function run(url, target, asHtml) {
  const t = performance.now();
  const r = await fetch(url, {credentials: 'same-origin'});
  const body = await r.text();
  const ms = (performance.now() - t).toFixed(0);
  const el = document.getElementById(target);
  if (asHtml) el.innerHTML = body; else el.textContent = body;
  log(`${url}: ${ms} мс, X-Cache=${r.headers.get('X-Cache') ?? '-'}`);
}
async function clearCache() {
  const r = await fetch('clear-cache.php');
  log(await r.text());
}
function log(msg) {
  document.getElementById('log').textContent += new Date().toLocaleTimeString() + ' ' + msg + '\n';
}
</script>
</body>
</html>
